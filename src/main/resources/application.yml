spring:
  application:
    name: agent-os

  datasource:
    # 本地文件库持久化（重启不丢）；AGENTOS_DB_PATH 可覆盖路径；测试用 src/test/resources/application.yml 的内存库
    url: jdbc:h2:file:${AGENTOS_DB_PATH:./data/agentos};MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  ai:
    openai:
      # Kimi Code 会员 API（OpenAI 兼容）；Key 从 Kimi Code Console 创建后注入环境变量，不入库
      api-key: ${KIMI_API_KEY:}
      base-url: ${KIMI_BASE_URL:https://api.kimi.com/coding/v1}
      chat:
        options:
          # k3.1-pro：旗舰模型（thinking 默认 max）；省额度可用 k3-256k，大上下文用 k3
          model: ${KIMI_MODEL:k3.1-pro}
          # thinking 强度：low / high / max；max 在复杂提示词下耗时过长，默认 high
          reasoning-effort: ${KIMI_REASONING_EFFORT:high}

server:
  port: 8080

agentos:
  feishu:
    approval:
      mock-mode: true
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      approval-code: ${FEISHU_APPROVAL_CODE:}
      approver-open-id: ${FEISHU_APPROVER_OPEN_ID:}
      poll-interval-ms: 5000
      max-poll-times: 60
  crossborder:
    base-url: ${CROSSBORDER_BASE_URL:https://test.admin.crossborder.com}
    email: ${CROSSBORDER_EMAIL:}
    password: ${CROSSBORDER_PASSWORD:}
    tenant-id: ${CROSSBORDER_TENANT_ID:1}
    site: ${CROSSBORDER_SITE:self_site}
    enabled: ${CROSSBORDER_ENABLED:true}
