spring:
  application:
    name: agent-os

  datasource:
    url: jdbc:h2:mem:agentos;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini

server:
  port: 8080

agentos:
  feishu:
    approval:
      mock-mode: true
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      approval-code: ${FEISHU_APPROVAL_CODE:}
      approver-open-id: ${FEISHU_APPROVER_OPEN_ID:}
      poll-interval-ms: 5000
      max-poll-times: 60
  跨境:
    base-url: ${跨境_BASE_URL:https://test.admin.跨境.com}
    email: ${跨境_EMAIL:}
    password: ${跨境_PASSWORD:}
    tenant-id: ${跨境_TENANT_ID:1}
    site: ${跨境_SITE:self_site}
    enabled: ${跨境_ENABLED:true}
